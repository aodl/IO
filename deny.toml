[advisories]
version = 2
yanked = "warn"
ignore = [
  # Dev/test only through pocket-ic 14.0.0; retire when PocketIC removes backoff 0.4.
  "RUSTSEC-2025-0012",
  # Dev/test only through backoff 0.4/pocket-ic; retires with the backoff exception above.
  "RUSTSEC-2024-0384",
  # Production transitive through candid 0.10.x; retire when the pinned IC stack removes paste.
  "RUSTSEC-2024-0436",
  # Production frontend transitively uses serde_cbor through ic-http-certification;
  # tests also receive it through PocketIC. Retire when both upstream paths remove serde_cbor.
  "RUSTSEC-2021-0127",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
