name: reproducible-build

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Artifact provenance requires the exact recorded source commit to be
          # locally available for detached-worktree builds.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Verify checked-in artifacts and repeated exact-source builds
        run: cargo run -p xtask -- verify_recorded_source
