name: reproducible-build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Artifact provenance requires the exact recorded source commit to be
          # locally available for detached-worktree builds.
          fetch-depth: 0
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Verify checked-in artifacts and repeated exact-source builds
        run: cargo run -p xtask -- verify_recorded_source
