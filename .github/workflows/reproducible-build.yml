name: reproducible-build

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Artifact provenance requires the recorded source commit to be
          # locally available and reachable from the PR merge HEAD.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Resolve release source commit
        shell: bash
        run: |
          source_commit="$(jq -er '.git_commit' release-artifacts/manifest.json)"
          git cat-file -e "${source_commit}^{commit}"
          echo "IO_RELEASE_SOURCE_COMMIT=${source_commit}" >> "${GITHUB_ENV}"

      - name: First build
        run: tools/scripts/build-release-from-source "${IO_RELEASE_SOURCE_COMMIT}"

      - name: First manifest
        run: cp release-artifacts/manifest.json /tmp/io-manifest-first.json

      - name: Clean build outputs
        run: rm -rf release-artifacts

      - name: Second build
        run: tools/scripts/build-release-from-source "${IO_RELEASE_SOURCE_COMMIT}"

      - name: Compare manifests
        run: cmp /tmp/io-manifest-first.json release-artifacts/manifest.json

      - name: Verify artifacts
        run: cargo run -p xtask -- verify_artifacts
