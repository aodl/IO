name: reproducible-build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Artifact provenance requires the exact recorded source commit to be
          # locally available for detached-worktree builds.
          fetch-depth: 0
      - name: Verify exact event source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          echo "validated source SHA: ${actual_head}"
          if [[ "${actual_head}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "checked-out HEAD ${actual_head} does not equal intended event SHA ${EXPECTED_SOURCE_SHA}" >&2
            exit 1
          fi
      - name: Verify pull-request fast-forward lineage
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base --is-ancestor "${PR_BASE_SHA}" HEAD; then
            echo "PR base ${PR_BASE_SHA} is not an ancestor of PR head ${PR_HEAD_SHA}" >&2
            exit 1
          fi
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Verify checked-in artifacts and repeated exact-source builds
        run: cargo run -p xtask -- verify_recorded_source
