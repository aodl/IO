name: test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Exact release verification materializes the recorded source commit.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Provision pinned PocketIC
        shell: bash
        run: |
          pocket_ic_bin="${RUNNER_TEMP}/pocket-ic-server-14.0.0"
          tools/scripts/provision-pocket-ic "${pocket_ic_bin}"
          echo "POCKET_IC_BIN=${pocket_ic_bin}" >> "${GITHUB_ENV}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Wasm check
        run: cargo check -p io-stream-manager -p io-nns-neuron-manager --target wasm32-unknown-unknown

      - name: DID surface
        run: cargo run -p xtask -- did_surface

      - name: Build exact recorded release source
        run: tools/scripts/build-release-from-source "$(jq -er '.git_commit' release-artifacts/manifest.json)"

      - name: Verify artifacts
        run: cargo run -p xtask -- verify_artifacts

      - name: Validate install args
        run: cargo run -p xtask -- validate_install_args

      - name: PocketIC required tests
        run: cargo run -p xtask -- test_pocketic_required
