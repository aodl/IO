name: test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Exact release verification materializes the recorded source commit.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Provision pinned PocketIC
        shell: bash
        run: |
          pocket_ic_bin="${RUNNER_TEMP}/pocket-ic-server-14.0.0"
          tools/scripts/provision-pocket-ic "${pocket_ic_bin}"
          echo "POCKET_IC_BIN=${pocket_ic_bin}" >> "${GITHUB_ENV}"

      - name: Canonical repository CI
        run: cargo run -p xtask -- test_ci
