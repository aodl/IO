name: security

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Provision pinned security tools
        run: tools/scripts/provision-security-tools

      - name: Security scan
        run: cargo run -p xtask -- security_scan_required
